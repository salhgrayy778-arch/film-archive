<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" fill="none" aria-hidden="true">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DDBD81"/><stop offset="1" stop-color="#6B4F2B"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92C9C3"/><stop offset="1" stop-color="#356F77"/></linearGradient>
 <radialGradient id="mist"><stop stop-color="#C6A772" stop-opacity=".26"/><stop offset="1" stop-color="#C6A772" stop-opacity="0"/></radialGradient>
 <radialGradient id="tealMist"><stop stop-color="#79BAB8" stop-opacity=".22"/><stop offset="1" stop-color="#79BAB8" stop-opacity="0"/></radialGradient>
 <pattern id="grain" width="39" height="39" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r=".6" fill="#DCC69C" opacity=".26"/><circle cx="25" cy="28" r=".9" fill="#83B2B6" opacity=".18"/></pattern>
 <pattern id="sprocket" width="34" height="52" patternUnits="userSpaceOnUse"><rect x="9" y="13" width="16" height="25" rx="5" stroke="#C9A971" stroke-width="1" opacity=".3"/></pattern>
 <g id="reel" stroke="url(#gold)" stroke-width="3">
  <circle r="102"/><circle r="87" stroke-width="1.6"/><circle r="17"/><circle r="8" fill="#C8A971" stroke="none"/>
  <g fill="url(#gold)" stroke="none" opacity=".48">
   <ellipse cy="-55" rx="19" ry="26"/><ellipse cy="55" rx="19" ry="26"/>
   <ellipse cx="-55" rx="26" ry="19"/><ellipse cx="55" rx="26" ry="19"/>
   <ellipse cx="39" cy="-39" rx="19" ry="23" transform="rotate(45 39 -39)"/>
   <ellipse cx="-39" cy="39" rx="19" ry="23" transform="rotate(45 -39 39)"/>
   <ellipse cx="-39" cy="-39" rx="19" ry="23" transform="rotate(-45 -39 -39)"/>
   <ellipse cx="39" cy="39" rx="19" ry="23" transform="rotate(-45 39 39)"/>
  </g>
 </g>
 <g id="star" fill="#E4C887"><path d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2Z"/></g>
 <g id="spark" stroke="#9BC5C2" stroke-width="1.5" stroke-linecap="round"><path d="M0-14V14M-14 0H14"/></g>
</defs>
<rect width="1600" height="1180" fill="url(#grain)"/>
<!-- Ambient light blooms behind outer cinematic objects, leaving central content quiet -->
<ellipse cx="1535" cy="270" rx="510" ry="420" fill="url(#mist)"/>
<ellipse cx="70" cy="880" rx="470" ry="440" fill="url(#tealMist)"/>
<ellipse cx="820" cy="80" rx="420" ry="260" fill="url(#mist)" opacity=".6"/>
<!-- Film tracks travelling down the edges -->
<g opacity=".42" stroke="url(#gold)" stroke-width="2">
 <path d="M38-30V1220M80-30V1220M1525-30V1220M1565-30V1220" stroke-dasharray="11 5"/>
 <rect x="38" y="0" width="42" height="1180" fill="url(#sprocket)" stroke="none"/>
 <rect x="1525" y="0" width="42" height="1180" fill="url(#sprocket)" stroke="none"/>
</g>
<!-- Big backlit film reel, top-right -->
<g transform="translate(1375 215) rotate(18)" opacity=".42"><use href="#reel"/><circle r="118" stroke="url(#teal)" stroke-width="1" stroke-dasharray="4 15"/></g>
<g transform="translate(1490 475) rotate(-8) scale(.42)" opacity=".27"><use href="#reel"/></g>
<!-- Antique movie projector with twin reels -->
<g transform="translate(130 450) rotate(-8)" stroke="#A5BEB9" stroke-width="3" opacity=".37" stroke-linecap="round" stroke-linejoin="round">
 <circle cx="-10" cy="-92" r="49"/><circle cx="100" cy="-96" r="49"/>
 <g fill="#90B8B1" opacity=".3" stroke="none">
  <circle cx="-10" cy="-116" r="13"/><circle cx="12" cy="-83" r="13"/><circle cx="-33" cy="-80" r="13"/>
  <circle cx="100" cy="-121" r="13"/><circle cx="122" cy="-87" r="13"/><circle cx="79" cy="-85" r="13"/>
 </g>
 <rect x="-30" y="-38" width="164" height="122" rx="16"/>
 <path d="M134-10 216 15V44L134 71Z"/><path d="M-12 84V140M112 84V140M-40 141H145"/>
 <path d="M52 84 18 141M52 84 92 141"/>
 <circle cx="52" cy="16" r="30"/><circle cx="52" cy="16" r="9"/>
 <path d="M218 13 355-58 355 112 218 44Z" stroke="#CBAD78" stroke-width="1.4" stroke-dasharray="6 8" opacity=".55"/>
</g>
<!-- Film-strip ribbon crossing lower-left corner -->
<g opacity=".32" stroke="url(#gold)" stroke-width="3" transform="rotate(17 80 865)">
 <path d="M-135 768Q88 706 290 830T590 811"/><path d="M-135 850Q88 788 290 912T590 893"/>
 <path d="M-100 785V850M-50 773V843M0 769V843M50 766V837M100 768V842M150 782V861M200 804V883M250 832V902M300 853V916M350 865V924M400 870V932" stroke-dasharray="6 9" opacity=".8"/>
</g>
<!-- Clapboard and framed ticket at lower-right -->
<g transform="translate(1284 816) rotate(13)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round" opacity=".5">
 <rect x="-10" y="33" width="190" height="130" rx="12"/>
 <path d="M-15 36-30-7 156-60 169-15Z"/>
 <path d="M4 29 28-18M47 18 71-30M91 8 114-41M134-3 155-50" stroke-width="14" opacity=".47"/>
 <path d="M19 78H148M19 103H110M19 126H89" stroke-width="2" opacity=".6"/>
 <circle cx="142" cy="115" r="14" stroke-width="2" opacity=".6"/>
</g>
<g transform="translate(131 1010) rotate(-13)" stroke="#B6A077" stroke-width="2" opacity=".35">
 <rect width="170" height="82" rx="12"/>
 <path d="M30 0C30 18 30 25 30 40S30 62 30 82M140 0C140 18 140 25 140 40S140 62 140 82" stroke-dasharray="5 6"/>
 <circle cx="85" cy="41" r="25"/><path d="M78 26v30l21-15z" fill="#C6AE79" stroke="none"/>
</g>
<!-- Sparse star lights, projector flare markers -->
<g opacity=".42">
 <use href="#star" transform="translate(1155 140) scale(1.5)"/><use href="#star" transform="translate(1451 633) scale(.9)"/>
 <use href="#star" transform="translate(416 322) scale(.9)"/><use href="#star" transform="translate(292 1004) scale(1.1)"/>
 <use href="#spark" transform="translate(1204 693)"/><use href="#spark" transform="translate(344 562) scale(.7)"/>
 <use href="#spark" transform="translate(1387 1043) scale(.9)"/>
</g>
<g stroke="url(#teal)" stroke-width="1" opacity=".2">
 <circle cx="1180" cy="615" r="52"/><circle cx="1180" cy="615" r="66" stroke-dasharray="7 12"/>
 <circle cx="320" cy="280" r="38"/><path d="M306 280h28m-14-14v28"/>
</g>
</svg>