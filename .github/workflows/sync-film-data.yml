name: Sync shared film database (light, every 15 minutes)

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes (off the :00 mark). Each run touches at most a few dozen films.
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_film_data.py'
      - '.github/workflows/sync-film-data.yml'

permissions:
  contents: write

# All jobs that write data/tmdb-*.json share one lane so they never clash.
concurrency:
  group: tmdb-data-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/sync-film-data.yml
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests==2.32.5 Pillow==11.3.0 feedparser==6.0.12
      - name: Repair, refresh and grow the shared film database (bounded)
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/sync_film_data.py --repair 25 --refresh 30 --grow 20
      - name: Validate JSON before publishing
        run: |
          python - <<'PY'
          import json
          for p in ("data/tmdb-catalog.json", "data/tmdb-extra.json", "data/sync-status.json"):
              try:
                  json.load(open(p, encoding="utf-8"))
              except FileNotFoundError:
                  pass
          print("data files valid")
          PY
      - name: Commit only when something changed
        run: |
          git add data/tmdb-catalog.json data/tmdb-extra.json data/sync-status.json assets/catalog/
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: light sync of shared TMDB film database"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Push skipped; the next scheduled run will retry"
          exit 0
