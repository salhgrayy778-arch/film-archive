name: Static site security regression checks

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'scripts/security_check.py'
      - 'tests/**'
      - '.github/workflows/security-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - 'scripts/security_check.py'
      - 'tests/**'
      - '.github/workflows/security-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check public security baseline
        run: python3 scripts/security_check.py
      - name: Validate JavaScript module syntax
        run: |
          node --check film-friends.js
          node --check account-profile.js
          node --check film-discovery.js
          node --check group-watch.js
          node --check cinema-translation.js
      - name: Test host and guest watch-room connection
        run: node tests/group-watch-connection.cjs
      - name: Test movie search, watchlists and deep links
        run: node tests/film-discovery-smoke.cjs
