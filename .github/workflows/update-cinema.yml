name: Refresh cinema news and official movie posters

on:
  workflow_dispatch:
  schedule:
    # Eight refreshes daily; the public website only reads same-origin files.
    - cron: '17 */3 * * *'
  push:
    paths:
      - 'scripts/update_cinema.py'
      - 'scripts/build_catalog.py'
      - 'scripts/translate_news.py'
      - 'scripts/translate_movie_details.py'
      - '.github/workflows/update-cinema.yml'

permissions:
  contents: write

concurrency:
  group: tmdb-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed and image dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests==2.32.5 feedparser==6.0.12 Pillow==12.0.0
      - name: Fetch headlines, movie metadata and genuine TMDB posters
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_cinema.py
      - name: Install offline English-to-Persian translator
        run: python -m pip install --disable-pip-version-check --quiet argostranslate==1.11.0 deep-translator==1.11.4
      - name: Cache offline Persian language model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-en-fa-v1
      - name: Pretranslate news for VPN-free Persian reading
        env:
          ARGOS_DEVICE_TYPE: cpu
        run: python scripts/translate_news.py
      - name: Build searchable TMDB film index with local poster art
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_catalog.py
      - name: Build Persian movie synopsis cache for every homepage film
        env:
          ARGOS_DEVICE_TYPE: cpu
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/translate_movie_details.py
      - name: Commit updated data and cached posters
        run: |
          git add data/home-feed.json data/tmdb-catalog.json assets/posters/ assets/news/ assets/catalog/
          if git diff --cached --quiet; then
            echo "No data changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh cinema news and official TMDB movie posters"
          git pull --rebase origin main
          git push origin HEAD:main
